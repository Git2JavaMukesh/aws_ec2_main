name: docker-build->push->deploy

on:
  push:
    branches: [ "main" ]  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:    
    - name: Checkout code
      uses: actions/checkout@v4
    - name: setup java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        
    - name: build jar
      run: |
        cd deployToEc2
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests

    - name: login to dockerhub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKERHUB_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    
    - name: build the docker image
      run: docker build -t ${{secrets.DOCKERHUB_USER_NAME}}/ec2-image:latest
    - name: push image to docker hub
      run: docker push ${{secrets.DOCKERHUB_USER_NAME}}/ec2-image:latest
    - name: ssh and deploy to java
      uses: appleboy/ssh-action@v0.1.6       
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |           
            docker stop ec2-demo || true
            docker rm ec2-demo || true
            docker pull ${{secrets.DOCKERHUB_USER_NAME}}/ec2-image:latest
            docker run -d --name ec2-demo -p 8080:8080 ${{secrets.DOCKERHUB_USER_NAME}}/ec2-image:latest
